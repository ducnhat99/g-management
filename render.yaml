# Render Blueprint for the API. In Render: New > Blueprint > pick this repo.
# Values marked `sync: false` are asked for when the Blueprint is created; they are never committed.
services:
  - type: web
    name: gold-tracker-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore
    # free sleeps after ~15 min idle (first request then takes 30-60 s). starter does not.
    plan: free
    healthCheckPath: /health
    # Only redeploy when something the API uses changes (not on web-only commits).
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PRICE_TTL_SECONDS
        value: '3600'
      - key: PRICE_FAILURE_BACKOFF_SECONDS
        value: '60'
